[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terror-zone-telebot"
version = "2.0.0"
description = "Telegram bot that announces Diablo II: Resurrected terror zone rotations"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nikolay Miroshnichenko" }]
keywords = ["diablo2", "d2r", "terror-zone", "telegram-bot", "aiogram"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "aiogram>=3.15,<4",
    "aiohttp>=3.10",
    "aiosqlite>=0.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/cprite/terror-zone-telebot"
Issues = "https://github.com/cprite/terror-zone-telebot/issues"

[project.scripts]
tzbot = "tzbot.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:tzbot.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The locale table is Cyrillic and CJK by design; RUF001 flags every letter.
"src/tzbot/i18n.py" = ["RUF001", "E501"]
